<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - ÖZU.LMS</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
.login-page {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1fr 1fr;
  background: var(--color-bg);
}
.login-visual {
  background: linear-gradient(135deg, #0a0a0a 0%, #1a0a12 50%, #0a0a1a 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px;
  position: relative;
  overflow: hidden;
}
.login-visual::before {
  content: '';
  position: absolute;
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(200,16,46,0.12) 0%, transparent 70%);
  top: 50%; left: 50%;
  transform: translate(-50%,-50%);
}
.login-visual::after {
  content: '';
  position: absolute;
  width: 400px; height: 400px;
  background: radial-gradient(circle, rgba(233,30,140,0.08) 0%, transparent 70%);
  top: 20%; left: 20%;
}
.login-hero-img {
  width: 100%;
  max-width: 480px;
  border-radius: 16px;
  opacity: 0.85;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  position: relative;
  z-index: 1;
}
.login-visual-text {
  position: relative;
  z-index: 1;
  text-align: center;
  margin-top: 32px;
}
.login-visual-text h2 {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
  color: var(--color-white);
  margin-bottom: 8px;
}
.login-visual-text p { color: var(--color-text-muted); font-size: 14px; }
.login-form-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 48px;
}
.login-box { width: 100%; max-width: 380px; }
.login-logo {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 40px;
}
.login-logo-icon {
  width: 44px; height: 44px;
  background: var(--color-primary);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-weight: 800;
  color: white;
  font-size: 15px;
}
.login-logo-text {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
  color: var(--color-white);
}
.login-logo-text span { color: var(--color-primary); }
.login-title {
  font-family: var(--font-display);
  font-size: 26px;
  font-weight: 700;
  color: var(--color-white);
  margin-bottom: 6px;
}
.login-subtitle { color: var(--color-text-muted); font-size: 14px; margin-bottom: 32px; }
.input-wrap {
  position: relative;
}
.input-wrap .form-control { padding-left: 40px; }
.input-wrap .input-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--color-text-dim);
  font-size: 14px;
}
.input-wrap .input-toggle {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--color-text-dim);
  cursor: pointer;
  font-size: 13px;
  background: none;
  border: none;
  padding: 4px;
}
.input-wrap .input-toggle:hover { color: var(--color-text); }
.login-options {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 12px 0 24px;
}
.checkbox-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--color-text-muted);
  cursor: pointer;
  user-select: none;
}
.checkbox-wrap input[type=checkbox] { accent-color: var(--color-primary); }
.login-link { font-size: 13px; color: var(--color-primary); text-decoration: none; }
.login-link:hover { text-decoration: underline; }
.login-btn {
  width: 100%;
  padding: 12px;
  font-size: 15px;
  font-weight: 600;
  justify-content: center;
  gap: 8px;
  letter-spacing: 0.3px;
}
.login-divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 24px 0;
  color: var(--color-text-dim);
  font-size: 12px;
}
.login-divider::before, .login-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--color-border);
}
.demo-info {
  background: var(--color-surface2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  padding: 12px 14px;
  font-size: 12px;
  color: var(--color-text-muted);
  text-align: center;
}
.demo-info strong { color: var(--color-text); }
.error-msg {
  color: #ef5350;
  font-size: 12px;
  margin-top: 4px;
  display: none;
}
@media (max-width: 768px) {
  .login-page { grid-template-columns: 1fr; }
  .login-visual { display: none; }
  .login-form-wrap { padding: 40px 24px; }
}
</style>
</head>
<body>
<div class="login-page">
  <div class="login-visual">
    <img src="https://images.unsplash.com/photo-1436491865332-7a61a109cc05?w=600&h=400&fit=crop" alt="Airport" class="login-hero-img">
    <div class="login-visual-text">
      <h2>University Learning Management System</h2>
      <p>Ozyegin University &bull; Spring 2025/26</p>
    </div>
  </div>
  <div class="login-form-wrap">
    <div class="login-box animate-in">
      <div class="login-logo">
        <div class="login-logo-icon">ÖZU</div>
        <div class="login-logo-text"><span>ÖZU</span>.LMS</div>
      </div>
      <div class="login-title">Welcome back</div>
      <div class="login-subtitle">Sign in to your student account</div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label">Username / Student ID</label>
          <div class="input-wrap">
            <i class="fas fa-user input-icon"></i>
            <input type="text" class="form-control" id="username" placeholder="e.g. vigneshrajan.t" autocomplete="username">
          </div>
          <div class="error-msg" id="username-error">Please enter your username</div>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-wrap">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" class="form-control" id="password" placeholder="Enter your password" autocomplete="current-password">
            <button type="button" class="input-toggle" id="toggle-pw">
              <i class="fas fa-eye"></i>
            </button>
          </div>
          <div class="error-msg" id="password-error">Please enter your password</div>
        </div>
        <div class="login-options">
          <label class="checkbox-wrap">
            <input type="checkbox" id="remember"> Remember me
          </label>
          <a href="#" class="login-link">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary login-btn">
          <i class="fas fa-sign-in-alt"></i> Sign In
        </button>
        <div class="login-divider">or</div>
        <div class="demo-info">
          <strong>Demo:</strong> Any username and password will work. Just click Sign In.
        </div>
      </form>
    </div>
  </div>
</div>

<script>
document.getElementById('toggle-pw').addEventListener('click', function() {
  const pw = document.getElementById('password');
  const icon = this.querySelector('i');
  if (pw.type === 'password') {
    pw.type = 'text';
    icon.className = 'fas fa-eye-slash';
  } else {
    pw.type = 'password';
    icon.className = 'fas fa-eye';
  }
});

document.getElementById('login-form').addEventListener('submit', function(e) {
  e.preventDefault();
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value.trim();
  let valid = true;

  if (!u) {
    document.getElementById('username-error').style.display = 'block';
    valid = false;
  } else document.getElementById('username-error').style.display = 'none';

  if (!p) {
    document.getElementById('password-error').style.display = 'block';
    valid = false;
  } else document.getElementById('password-error').style.display = 'none';

  if (valid) {
    const btn = this.querySelector('.login-btn');
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';
    setTimeout(() => { window.location.href = 'dashboard.html'; }, 1200);
  }
});
</script>
</body>
</html>
