<!-- File: assignments.html -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assignments - ÖZU.LMS</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
.assignment-card {
  display: flex; gap: 14px; align-items: flex-start;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: 16px;
  margin-bottom: 12px;
  transition: all 0.15s;
}
.assignment-card:hover { border-color: rgba(200,16,46,0.3); }
.asg-icon {
  width: 44px; height: 44px;
  border-radius: var(--radius);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0;
}
.asg-body { flex: 1; min-width: 0; }
.asg-title { font-weight: 600; font-size: 14px; color: var(--color-white); margin-bottom: 4px; }
.asg-meta { font-size: 12px; color: var(--color-text-muted); margin-bottom: 8px; }
.asg-desc { font-size: 12px; color: var(--color-text-muted); margin-bottom: 10px; }
.asg-footer { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.asg-section { margin-bottom: 28px; }
.asg-section-title {
  font-size: 13px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase;
  color: var(--color-text-dim); margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
}
.asg-section-title::after { content:''; flex:1; height:1px; background:var(--color-border); }
</style>
</head>
<body>
<div id="sidebar-placeholder"></div>
<div id="topbar-placeholder"></div>
<main class="main-content">
  <div class="page-header animate-in" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
    <div>
      <h1 class="page-title">Assignments</h1>
      <p class="page-subtitle">Coursework, projects, and submission deadlines</p>
    </div>
    <select class="form-control" id="asg-course-filter" style="width:auto;" onchange="filterAssignments()">
      <option value="">All Courses</option>
      <option value="AVM 204.A">AVM 204.A</option>
      <option value="AVM 306.A">AVM 306.A</option>
      <option value="AVM 402.A">AVM 402.A</option>
      <option value="MGMT 311.A">MGMT 311.A</option>
      <option value="SCM 205">SCM 205</option>
    </select>
  </div>

  <div id="assignments-main" class="animate-in" style="animation-delay:0.05s;"></div>
</main>
<div id="toast-container"></div>
<script src="js/layout.js"></script>
<script src="js/main.js"></script>
<script>
document.getElementById('sidebar-placeholder').innerHTML = getSidebar('assignments.html');
document.getElementById('topbar-placeholder').innerHTML = getTopbar('Assignments', [{ label: 'Assignments' }]);

const ASSIGNMENTS = [
  { id:1, type:'pending', course:'AVM 204.A', title:'Airport Master Plan Analysis', desc:'Analyze a real airport master plan. Include terminal design, runway configuration, and expansion recommendations.', dueDate:'Jun 15, 2026', marks:100, icon:'fas fa-file-alt', iconBg:'rgba(245,124,0,0.15)', iconColor:'#ffa726', daysLeft:4 },
  { id:2, type:'pending', course:'AVM 306.A', title:'FMEA Classwork II', desc:'Complete Failure Mode and Effects Analysis for an aviation service process. Detailed methodology and risk assessment required.', dueDate:'Jun 20, 2026', marks:100, icon:'fas fa-clipboard-check', iconBg:'rgba(46,125,50,0.15)', iconColor:'#66bb6a', daysLeft:9 },
  { id:3, type:'pending', course:'AVM 402.A', title:'Business Simulation Round 3 Decision', desc:'Submit your business decisions for Round 3. Include financial analysis and strategic justification for all decisions.', dueDate:'Jun 12, 2026', marks:50, icon:'fas fa-gamepad', iconBg:'rgba(233,30,140,0.15)', iconColor:'var(--color-pink)', daysLeft:1 },
  { id:4, type:'pending', course:'MGMT 311.A', title:'Project Schedule & Budget Planning', desc:'Develop a comprehensive project schedule using Gantt chart and create a detailed budget breakdown with risk contingencies.', dueDate:'Jun 18, 2026', marks:100, icon:'fas fa-calendar-check', iconBg:'rgba(21,101,192,0.15)', iconColor:'#42a5f5', daysLeft:7 },
  { id:5, type:'graded', course:'AVM 306.A', title:'FMEA Classwork I', desc:'Failure Mode and Effects Analysis assignment - Excellent work on identifying potential failure points and mitigation strategies.', dueDate:'Jun 2, 2026', marks:100, score:100, icon:'fas fa-star', iconBg:'rgba(200,16,46,0.15)', iconColor:'var(--color-primary)', submitted:'Jun 1, 2026' },
  { id:6, type:'graded', course:'MGMT 311.A', title:'Project Charter', desc:'Comprehensive project charter defining scope, objectives, stakeholders, and constraints. Well-organized and detailed submission.', dueDate:'Jun 5, 2026', marks:100, score:88, icon:'fas fa-file-contract', iconBg:'rgba(46,125,50,0.15)', iconColor:'#66bb6a', submitted:'Jun 4, 2026' },
  { id:7, type:'graded', course:'AVM 204.A', title:'Airport Systems Quiz', desc:'Online assessment covering airport terminal design, runway configuration, and airspace management concepts.', dueDate:'Mar 15, 2026', marks:100, score:88, icon:'fas fa-question-circle', iconBg:'rgba(21,101,192,0.15)', iconColor:'#42a5f5', submitted:'Mar 14, 2026' },
  { id:8, type:'graded', course:'AVM 306.A', title:'Operations Management Midterm Practice', desc:'Practice quiz with 30 questions covering process management, lean operations, and key performance indicators.', dueDate:'Apr 5, 2026', marks:100, score:92, icon:'fas fa-clipboard-check', iconBg:'rgba(46,125,50,0.15)', iconColor:'#66bb6a', submitted:'Apr 4, 2026' },
  { id:9, type:'graded', course:'MGMT 311.A', title:'Project Milestone Review', desc:'Mid-project documentation review. Submission was well-documented with clear progress indicators and risk assessments.', dueDate:'May 10, 2026', marks:100, score:95, icon:'fas fa-flag', iconBg:'rgba(245,124,0,0.15)', iconColor:'#ffa726', submitted:'May 9, 2026' },
  { id:10, type:'submitted', course:'AVM 204.A', title:'Guest Speaker Reflection', desc:'Reflective essay on the IGA guest speaker session. Analyze key takeaways and applications to airport strategic planning.', dueDate:'Jun 10, 2026', marks:50, icon:'fas fa-pen-fancy', iconBg:'rgba(233,30,140,0.15)', iconColor:'var(--color-pink)', submitted:'Jun 8, 2026', status:'Awaiting Grading' },
  { id:11, type:'submitted', course:'SCM 205', title:'Supply Chain Case Study Analysis', desc:'Comprehensive analysis of supply chain challenges in a real-world case. Include recommendations and implementation strategy.', dueDate:'Jun 5, 2026', marks:100, icon:'fas fa-briefcase', iconBg:'rgba(200,16,46,0.15)', iconColor:'var(--color-primary)', submitted:'Jun 3, 2026', status:'Awaiting Grading' },
];

function renderAssignments(list) {
  const grouped = {};
  list.forEach(a => {
    if (!grouped[a.type]) grouped[a.type] = [];
    grouped[a.type].push(a);
  });

  const typeOrder = ['pending', 'submitted', 'graded'];
  const typeLabels = { pending:'Pending Submissions', submitted:'Submitted (Awaiting Grade)', graded:'Graded' };

  let html = '';
  typeOrder.forEach(type => {
    if (!grouped[type] || !grouped[type].length) return;
    html += `<div class="asg-section">
      <div class="asg-section-title">${typeLabels[type]}</div>
      ${grouped[type].map(a => `
        <div class="assignment-card">
          <div class="asg-icon" style="background:${a.iconBg};color:${a.iconColor};"><i class="${a.icon}"></i></div>
          <div class="asg-body">
            <div class="asg-title">${a.title}</div>
            <div class="asg-meta">${a.course} &bull; ${a.marks} marks ${a.daysLeft ? '&bull; <strong style="color:#ffa726;">' + a.daysLeft + 'd left</strong>' : ''}</div>
            <div class="asg-desc">${a.desc}</div>
            <div class="asg-footer">
              ${a.dueDate ? `<span class="chip chip-${a.daysLeft <= 2 ? 'red' : a.daysLeft <= 7 ? 'orange' : 'gray'}" style="font-size:11px;"><i class="fas fa-calendar"></i> Due: ${a.dueDate}</span>` : ''}
              ${a.score ? `<span style="font-size:12px;font-weight:600;color:#66bb6a;"><i class="fas fa-star"></i> ${a.score}/${a.marks}</span>` : ''}
              ${a.submitted ? `<span style="font-size:11px;color:var(--color-text-dim);"><i class="fas fa-check"></i> Submitted: ${a.submitted}</span>` : ''}
              ${a.status ? `<span class="chip chip-blue" style="font-size:10px;">${a.status}</span>` : ''}
              <div style="margin-left:auto;display:flex;gap:6px;">
                ${a.type === 'pending' ? `<button class="btn btn-primary btn-sm" onclick="showToast('Opening assignment...','info')"><i class="fas fa-arrow-right"></i> Start</button>` : `<button class="btn btn-ghost btn-sm" onclick="showToast('Opening assignment details...','info')"><i class="fas fa-eye"></i> View</button>`}
              </div>
            </div>
          </div>
        </div>
      `).join('')}
    </div>`;
  });

  document.getElementById('assignments-main').innerHTML = html || '<div class="empty-state"><i class="fas fa-inbox"></i><p>No assignments found.</p></div>';
}

function filterAssignments() {
  const course = document.getElementById('asg-course-filter').value;
  renderAssignments(course ? ASSIGNMENTS.filter(a => a.course === course) : ASSIGNMENTS);
}

renderAssignments(ASSIGNMENTS);
</script>
</body>
</html>
