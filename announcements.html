<!-- File: announcements.html -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Announcements - ÖZU.LMS</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
.announcement-card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: 20px;
  margin-bottom: 16px;
  transition: all 0.15s;
}
.announcement-card:hover { border-color: rgba(200,16,46,0.3); box-shadow: var(--shadow); }
.announcement-header {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap;
}
.announcement-icon {
  width: 44px; height: 44px;
  border-radius: var(--radius);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0;
}
.announcement-meta {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.announcement-author { font-size: 12px; color: var(--color-text-muted); }
.announcement-date { font-size: 12px; color: var(--color-text-dim); }
.announcement-course { font-size: 11px; }
.announcement-title { font-size: 16px; font-weight: 700; color: var(--color-white); margin-bottom: 8px; }
.announcement-content { font-size: 13px; color: var(--color-text); line-height: 1.6; margin-bottom: 12px; }
.announcement-footer { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.ann-filter { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
</style>
</head>
<body>
<div id="sidebar-placeholder"></div>
<div id="topbar-placeholder"></div>
<main class="main-content">
  <div class="page-header animate-in" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
    <div>
      <h1 class="page-title">Announcements</h1>
      <p class="page-subtitle">Course announcements and university-wide news</p>
    </div>
    <select class="form-control" id="ann-course-filter" style="width:auto;" onchange="filterAnnouncements()">
      <option value="">All Courses</option>
      <option value="AVM 204.A">AVM 204.A</option>
      <option value="AVM 306.A">AVM 306.A</option>
      <option value="AVM 402.A">AVM 402.A</option>
      <option value="MGMT 311.A">MGMT 311.A</option>
      <option value="SCM 205">SCM 205</option>
      <option value="University">University</option>
    </select>
  </div>

  <div class="ann-filter animate-in" style="animation-delay:0.05s;">
    <div class="search-box" style="max-width:420px;">
      <i class="fas fa-search"></i>
      <input type="text" placeholder="Search announcements..." id="ann-search" oninput="filterAnnouncements()">
    </div>
  </div>

  <div id="announcements-list" class="animate-in" style="animation-delay:0.1s;"></div>
</main>
<div id="toast-container"></div>
<script src="js/layout.js"></script>
<script src="js/main.js"></script>
<script>
document.getElementById('sidebar-placeholder').innerHTML = getSidebar('announcements.html');
document.getElementById('topbar-placeholder').innerHTML = getTopbar('Announcements', [{ label: 'Announcements' }]);

const ANNOUNCEMENTS = [
  { id:1, course:'AVM 204.A', author:'Baris Orak', date:'Jun 2, 2026, 5:47 PM', title:'Tips for the Final Exam', content:'Focus on chapters 4-8 and review the airport case studies discussed in class. Make sure to understand the airport master planning process covered in weeks 3-5. Good luck!', icon:'fas fa-graduation-cap', iconBg:'rgba(200,16,46,0.15)', iconColor:'var(--color-primary)' },
  { id:2, course:'AVM 306.A', author:'Assoc. Prof. Leyla', date:'May 28, 2026, 2:30 PM', title:'Guest Speaker - Revenue Management', content:'Special guest speaker from Turkish Airlines will be joining us next week to discuss Revenue and Yield Management in aviation. This is a great opportunity to learn from industry professionals.', icon:'fas fa-microphone', iconBg:'rgba(233,30,140,0.15)', iconColor:'var(--color-pink)' },
  { id:3, course:'University', author:'Academic Office', date:'May 25, 2026, 10:15 AM', title:'Final Exam Schedule Published', content:'The final exam schedule for Spring 2025/26 has been published. Please check your individual exam slots carefully. Exam dates are from June 15-28, 2026.', icon:'fas fa-calendar-alt', iconBg:'rgba(46,125,50,0.15)', iconColor:'#66bb6a' },
  { id:4, course:'AVM 204.A', author:'Assoc. Prof. Sena Bicici', date:'May 15, 2026, 4:20 PM', title:'Guest Speaker: Omer Faruk Ekmekcioğlu', content:'Deputy Manager for Master Plan Management at IGA Istanbul Airport will cover the Strategic Planning Process. This session will provide insights into real-world airport planning challenges and solutions.', icon:'fas fa-microphone', iconBg:'rgba(245,124,0,0.15)', iconColor:'#ffa726' },
  { id:5, course:'MGMT 311.A', author:'Dr. Ali Kaya', date:'May 10, 2026, 1:45 PM', title:'Project Milestone Review Submission Deadline', content:'All mid-project milestone documentation must be submitted by May 15. Late submissions will incur a penalty. Please ensure your documentation is complete and well-organized.', icon:'fas fa-flag', iconBg:'rgba(21,101,192,0.15)', iconColor:'#42a5f5' },
  { id:6, course:'AVM 402.A', author:'Dr. Mehmet Yilmaz', date:'May 8, 2026, 3:10 PM', title:'Business Simulation Round 3 Details', content:'Round 3 of the Aviation Business Simulation will begin next week. Review the simulation manual and prepare your business decisions carefully. Teams should have their strategies ready.', icon:'fas fa-gamepad', iconBg:'rgba(233,30,140,0.15)', iconColor:'var(--color-pink)' },
  { id:7, course:'SCM 205', author:'Prof. Hakan Demir', date:'May 5, 2026, 11:30 AM', title:'New Case Study Posted', content:'A new supply chain case study has been posted for analysis. This case involves inventory management and supplier coordination. Submissions are due June 5, 2026.', icon:'fas fa-briefcase', iconBg:'rgba(200,16,46,0.15)', iconColor:'var(--color-primary)' },
  { id:8, course:'AVM 306.A', author:'Assoc. Prof. Leyla', date:'Apr 28, 2026, 2:00 PM', title:'FMEA Classwork I Graded', content:'The FMEA Classwork I submissions have been graded and feedback is available. Excellent work overall! The average score was 88/100. Classwork II will be assigned next week.', icon:'fas fa-check-circle', iconBg:'rgba(46,125,50,0.15)', iconColor:'#66bb6a' },
];

function renderAnnouncements(list) {
  if (!list.length) {
    document.getElementById('announcements-list').innerHTML = '<div class="empty-state"><i class="fas fa-bell-slash"></i><p>No announcements found.</p></div>';
    return;
  }
  document.getElementById('announcements-list').innerHTML = list.map(a => `
    <div class="announcement-card">
      <div class="announcement-header">
        <div style="display:flex;gap:14px;align-items:flex-start;flex:1;min-width:0;">
          <div class="announcement-icon" style="background:${a.iconBg};color:${a.iconColor};"><i class="${a.icon}"></i></div>
          <div style="flex:1;min-width:0;">
            <div class="announcement-title">${a.title}</div>
            <div class="announcement-meta">
              <span class="chip chip-gray" style="font-size:10px;">${a.course}</span>
              <span class="announcement-author"><i class="fas fa-user-circle" style="margin-right:4px;font-size:11px;"></i>${a.author}</span>
              <span class="announcement-date"><i class="fas fa-clock" style="margin-right:4px;font-size:11px;"></i>${a.date}</span>
            </div>
          </div>
        </div>
      </div>
      <div class="announcement-content">${a.content}</div>
      <div class="announcement-footer">
        <button class="btn btn-ghost btn-sm" onclick="showToast('Bookmarked announcement','success')"><i class="fas fa-bookmark"></i> Bookmark</button>
        <button class="btn btn-ghost btn-sm" onclick="showToast('Sharing...','info')"><i class="fas fa-share-alt"></i> Share</button>
      </div>
    </div>
  `).join('');
}

function filterAnnouncements() {
  const q = document.getElementById('ann-search').value.toLowerCase();
  const course = document.getElementById('ann-course-filter').value;
  let result = ANNOUNCEMENTS;
  if (q) result = result.filter(a => a.title.toLowerCase().includes(q) || a.content.toLowerCase().includes(q) || a.author.toLowerCase().includes(q));
  if (course) result = result.filter(a => a.course === course);
  renderAnnouncements(result);
}

renderAnnouncements(ANNOUNCEMENTS);
</script>
</body>
</html>
