<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search - ÖZU.LMS</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
.search-hero {
  background: linear-gradient(135deg,#1a0a12 0%,#0d1a2a 100%);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: 32px;
  text-align: center;
  margin-bottom: 24px;
}
.search-hero h2 { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--color-white); margin-bottom: 16px; }
.search-hero-input {
  display: flex;
  max-width: 560px; margin: 0 auto;
  background: var(--color-surface);
  border: 2px solid var(--color-border);
  border-radius: 40px;
  padding: 4px 4px 4px 20px;
  gap: 8px; align-items: center;
  transition: border-color 0.2s;
}
.search-hero-input:focus-within { border-color: var(--color-primary); }
.search-hero-input input { flex:1; background:none; border:none; outline:none; font-size:15px; color:var(--color-text); font-family:var(--font-main); }
.search-hero-input input::placeholder { color:var(--color-text-dim); }
.search-hero-input button { background:var(--color-primary); color:white; border:none; border-radius:36px; padding:10px 20px; font-size:13px; font-weight:600; cursor:pointer; display:flex;align-items:center;gap:6px;transition:background 0.15s; }
.search-hero-input button:hover { background:var(--color-primary-hover); }
.result-item {
  display: flex; gap: 14px; align-items: flex-start;
  padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
}
.result-item:last-child { border-bottom: none; }
.result-icon { width:38px;height:38px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0; }
.result-body { flex:1;min-width:0; }
.result-title { font-weight:600;font-size:14px;color:var(--color-white);margin-bottom:3px; }
.result-title mark { background:rgba(200,16,46,0.25);color:var(--color-primary);border-radius:2px;padding:0 2px; }
.result-desc { font-size:12px;color:var(--color-text-muted); }
.result-meta { display:flex;gap:8px;align-items:center;margin-top:6px; }
.tab-count { font-size:10px;background:var(--color-surface2);color:var(--color-text-muted);padding:2px 7px;border-radius:10px;margin-left:4px; }
</style>
</head>
<body>
<div id="sidebar-placeholder"></div>
<div id="topbar-placeholder"></div>
<main class="main-content">
  <div class="search-hero animate-in">
    <h2><i class="fas fa-search" style="color:var(--color-primary);margin-right:8px;"></i> Global Search</h2>
    <div class="search-hero-input">
      <i class="fas fa-search" style="color:var(--color-text-dim);font-size:15px;"></i>
      <input type="text" id="main-search" placeholder="Search courses, materials, assignments, announcements..." autocomplete="off" oninput="doSearch(this.value)">
      <button onclick="doSearch(document.getElementById('main-search').value)"><i class="fas fa-search"></i> Search</button>
    </div>
    <div style="margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;" id="recent-tags">
      <span style="font-size:12px;color:var(--color-text-dim);">Recent:</span>
      <span class="chip chip-gray" style="cursor:pointer;" onclick="fillSearch('airport planning')">airport planning</span>
      <span class="chip chip-gray" style="cursor:pointer;" onclick="fillSearch('FMEA')">FMEA</span>
      <span class="chip chip-gray" style="cursor:pointer;" onclick="fillSearch('attendance')">attendance</span>
      <span class="chip chip-gray" style="cursor:pointer;" onclick="fillSearch('final exam')">final exam</span>
    </div>
  </div>

  <div id="search-content" class="animate-in" style="animation-delay:0.05s;"></div>
</main>
<div id="toast-container"></div>
<script src="js/layout.js"></script>
<script src="js/main.js"></script>
<script>
document.getElementById('sidebar-placeholder').innerHTML = getSidebar('search.html');
document.getElementById('topbar-placeholder').innerHTML = getTopbar('Search', [{ label: 'Search' }]);

const SEARCH_DATA = {
  courses: [
    { title:'AVM 204.A: Airport Strategic Planning and Design', desc:'Spring 2025/26 - Assoc. Prof. Sena Bicici', tag:'Course', link:'course-details.html?id=AVM204', icon:'fas fa-book-open', iconBg:'rgba(21,101,192,0.15)', iconColor:'#42a5f5' },
    { title:'AVM 306.A: Operations Management in Aviation', desc:'Spring 2025/26 - Assoc. Prof. Leyla Adiloglü', tag:'Course', link:'course-details.html?id=AVM306', icon:'fas fa-book-open', iconBg:'rgba(200,16,46,0.15)', iconColor:'var(--color-primary)' },
    { title:'AVM 402.A: Aviation Business Simulation', desc:'Spring 2025/26 - Dr. Mehmet Yilmaz', tag:'Course', link:'courses.html', icon:'fas fa-book-open', iconBg:'rgba(233,30,140,0.15)', iconColor:'var(--color-pink)' },
    { title:'MGMT 311.A: Project Management', desc:'Spring 2025/26 - Dr. Ali Kaya', tag:'Course', link:'courses.html', icon:'fas fa-book-open', iconBg:'rgba(46,125,50,0.15)', iconColor:'#66bb6a' },
    { title:'SCM 205: Supply Chain Management', desc:'Spring 2025/26 - Prof. Hakan Demir', tag:'Course', link:'courses.html', icon:'fas fa-book-open', iconBg:'rgba(245,124,0,0.15)', iconColor:'#ffa726' },
  ],
  materials: [
    { title:'AVM 204 - Lecture Slides I', desc:'PDF · Week 1 · AVM 204.A · 4.8 MB', tag:'Material', link:'materials.html', icon:'fas fa-file-pdf', iconBg:'rgba(200,16,46,0.15)', iconColor:'var(--color-primary)' },
    { title:'Airport Strategic Planning Presentation', desc:'PPT · Week 5 · AVM 204.A · 12.1 MB', tag:'Material', link:'materials.html', icon:'fas fa-file-powerpoint', iconBg:'rgba(245,124,0,0.15)', iconColor:'#ffa726' },
    { title:'FMEA Template', desc:'DOCX · Week 6 · AVM 306.A · 0.5 MB', tag:'Material', link:'materials.html', icon:'fas fa-file-word', iconBg:'rgba(21,101,192,0.15)', iconColor:'#42a5f5' },
    { title:'Six Sigma DMAIC Toolkit', desc:'ZIP · Week 13 · AVM 306.A · 15.2 MB', tag:'Material', link:'materials.html', icon:'fas fa-file-archive', iconBg:'rgba(255,255,255,0.06)', iconColor:'#888' },
    { title:'AVM 306 Syllabus 2026 Spring EN', desc:'PDF · General · AVM 306.A · 0.9 MB', tag:'Material', link:'materials.html', icon:'fas fa-file-pdf', iconBg:'rgba(200,16,46,0.15)', iconColor:'var(--color-primary)' },
  ],
  assignments: [
    { title:'Airport Master Plan Analysis', desc:'Due: Jun 15, 2026 · AVM 204.A · 100 marks · Pending', tag:'Assignment', link:'assignments.html', icon:'fas fa-tasks', iconBg:'rgba(245,124,0,0.15)', iconColor:'#ffa726' },
    { title:'FMEA Classwork I', desc:'Submitted Jun 10, 2026 · AVM 306.A · 100 marks', tag:'Assignment', link:'assignments.html', icon:'fas fa-tasks', iconBg:'rgba(21,101,192,0.15)', iconColor:'#42a5f5' },
    { title:'Six Sigma Classwork II', desc:'Due: Jun 20, 2026 · AVM 306.A · 100 marks · Pending', tag:'Assignment', link:'assignments.html', icon:'fas fa-tasks', iconBg:'rgba(245,124,0,0.15)', iconColor:'#ffa726' },
    { title:'Project Charter', desc:'Graded: 88/100 · MGMT 311.A', tag:'Assignment', link:'assignments.html', icon:'fas fa-tasks', iconBg:'rgba(46,125,50,0.15)', iconColor:'#66bb6a' },
  ],
  announcements: [
    { title:'Tips for the Final Exam', desc:'By Baris Orak · Jun 2, 2026 · AVM 204.A', tag:'Announcement', link:'announcements.html', icon:'fas fa-bullhorn', iconBg:'rgba(200,16,46,0.15)', iconColor:'var(--color-primary)' },
    { title:'Final Exam Schedule Published', desc:'By Academic Office · May 25, 2026 · University', tag:'Announcement', link:'announcements.html', icon:'fas fa-university', iconBg:'rgba(21,101,192,0.15)', iconColor:'#42a5f5' },
    { title:'Guest Speaker - Revenue Management', desc:'By Assoc. Prof. Leyla · May 28, 2026 · AVM 306.A', tag:'Announcement', link:'announcements.html', icon:'fas fa-bullhorn', iconBg:'rgba(233,30,140,0.15)', iconColor:'var(--color-pink)' },
  ],
};

const ALL_ITEMS = [...SEARCH_DATA.courses,...SEARCH_DATA.materials,...SEARCH_DATA.assignments,...SEARCH_DATA.announcements];

function highlight(text, q) {
  if (!q) return text;
  const re = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi');
  return text.replace(re, '<mark>$1</mark>');
}

function doSearch(q) {
  const sc = document.getElementById('search-content');
  if (!q.trim()) {
    sc.innerHTML = renderDefault();
    return;
  }
  const filtered = ALL_ITEMS.filter(i => (i.title+i.desc+i.tag).toLowerCase().includes(q.toLowerCase()));
  if (!filtered.length) {
    sc.innerHTML = '<div class="empty-state"><i class="fas fa-search"></i><p>No results found for "'+q+'"</p></div>';
    return;
  }
  const categories = { Course:'courses', Material:'materials', Assignment:'assignments', Announcement:'announcements' };
  let html = `<div style="margin-bottom:14px;font-size:13px;color:var(--color-text-muted);">${filtered.length} result${filtered.length!==1?'s':''} for "<strong style="color:var(--color-white);">${q}</strong>"</div>`;

  // Tabs
  const byTag = {};
  filtered.forEach(i => { if (!byTag[i.tag]) byTag[i.tag] = []; byTag[i.tag].push(i); });
  const allTab = [['All', filtered], ...Object.entries(byTag)];

  html += `<div class="tabs" id="search-tabs">
    ${allTab.map((t,i) => `<button class="tab-btn ${i===0?'active':''}" data-tab="st-${i}">${t[0]} <span class="tab-count">${t[1].length}</span></button>`).join('')}
  </div>`;

  allTab.forEach((t, i) => {
    html += `<div id="st-${i}" class="tab-content ${i===0?'active':''}">
      <div class="card">
        ${t[1].map(r => `
          <div class="result-item">
            <div class="result-icon" style="background:${r.iconBg};color:${r.iconColor};"><i class="${r.icon}"></i></div>
            <div class="result-body">
              <div class="result-title">${highlight(r.title, q)}</div>
              <div class="result-desc">${r.desc}</div>
              <div class="result-meta">
                <span class="chip chip-gray" style="font-size:10px;">${r.tag}</span>
                <a href="${r.link}" class="btn btn-ghost btn-sm" style="margin-left:auto;">View <i class="fas fa-arrow-right"></i></a>
              </div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>`;
  });

  sc.innerHTML = html;
  initTabs(sc);
}

function renderDefault() {
  return `
    <div class="grid-3">
      ${Object.entries(SEARCH_DATA).map(([cat, items]) => `
        <div class="card">
          <div class="card-header">
            <div class="card-title" style="text-transform:capitalize;">${cat}</div>
            <span class="chip chip-gray">${items.length}</span>
          </div>
          ${items.slice(0,3).map(i => `
            <div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.04);">
              <div style="width:28px;height:28px;border-radius:6px;background:${i.iconBg};color:${i.iconColor};display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;"><i class="${i.icon}"></i></div>
              <div style="flex:1;min-width:0;"><div style="font-size:12px;font-weight:500;color:var(--color-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${i.title}</div></div>
            </div>
          `).join('')}
        </div>
      `).join('')}
    </div>`;
}

function fillSearch(q) {
  document.getElementById('main-search').value = q;
  doSearch(q);
}

document.getElementById('search-content').innerHTML = renderDefault();

document.getElementById('main-search').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch(e.target.value);
});
</script>
</body>
</html>
