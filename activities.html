<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activities - ÖZU.LMS</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
.activity-section { margin-bottom: 28px; }
.activity-section-title {
  font-size: 13px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase;
  color: var(--color-text-dim); margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
}
.activity-section-title::after { content:''; flex:1; height:1px; background:var(--color-border); }
.act-item {
  display: flex; gap: 14px; align-items: flex-start;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: 16px;
  margin-bottom: 10px;
  transition: all 0.15s;
}
.act-item:hover { border-color: rgba(200,16,46,0.3); }
.act-icon {
  width: 42px; height: 42px;
  border-radius: var(--radius);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}
.act-body { flex: 1; min-width: 0; }
.act-title { font-weight: 600; font-size: 14px; color: var(--color-white); margin-bottom: 4px; }
.act-meta { font-size: 12px; color: var(--color-text-muted); margin-bottom: 8px; }
.act-footer { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.completion-tracker {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: 20px;
}
.ct-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
.ct-item:last-child { border-bottom: none; }
.ct-check {
  width: 22px; height: 22px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px;
  flex-shrink: 0;
}
.ct-check.done { background: #2e7d32; color: white; }
.ct-check.pending { background: var(--color-surface2); border: 2px solid var(--color-border); color: transparent; }
</style>
</head>
<body>
<div id="sidebar-placeholder"></div>
<div id="topbar-placeholder"></div>
<main class="main-content">
  <div class="page-header animate-in" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
    <div>
      <h1 class="page-title">Activities</h1>
      <p class="page-subtitle">Quizzes, discussions, tasks, and learning activities</p>
    </div>
    <select class="form-control" id="act-course-filter" style="width:auto;" onchange="filterActivities()">
      <option value="">All Courses</option>
      <option value="AVM 204.A">AVM 204.A</option>
      <option value="AVM 306.A">AVM 306.A</option>
      <option value="AVM 402.A">AVM 402.A</option>
      <option value="MGMT 311.A">MGMT 311.A</option>
    </select>
  </div>

  <div class="grid-21 animate-in" style="animation-delay:0.05s;">
    <div id="activities-main"></div>
    <div>
      <!-- Completion Tracker -->
      <div class="completion-tracker animate-in" style="animation-delay:0.1s;">
        <div class="card-header" style="margin-bottom:16px;">
          <div class="card-title">Completion Tracker</div>
          <span class="chip chip-green">8/12</span>
        </div>
        <div style="margin-bottom:12px;">
          <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--color-text-muted);margin-bottom:6px;">
            <span>Overall Progress</span><span>67%</span>
          </div>
          <div class="progress-bar"><div class="progress-fill gradient" style="width:67%"></div></div>
        </div>
        <div id="ct-list"></div>
      </div>
    </div>
  </div>
</main>
<div id="toast-container"></div>
<script src="js/layout.js"></script>
<script src="js/main.js"></script>
<script>
document.getElementById('sidebar-placeholder').innerHTML = getSidebar('activities.html');
document.getElementById('topbar-placeholder').innerHTML = getTopbar('Activities', [{ label: 'Activities' }]);

const ACTIVITIES = [
  { id:1, type:'attendance', course:'AVM 306.A', title:'Attendances', desc:'Track your class attendance for Operations Management in Aviation.', icon:'fas fa-user-check', iconBg:'rgba(233,30,140,0.15)', iconColor:'var(--color-pink)', status:'done', count:'14/14 recorded' },
  { id:2, type:'resource', course:'AVM 306.A', title:'Resources', desc:'Lecture slides, case studies, and supplementary materials.', icon:'fas fa-file-alt', iconBg:'rgba(255,255,255,0.06)', iconColor:'var(--color-text-muted)', status:'done', count:'12 files' },
  { id:3, type:'quiz', course:'AVM 204.A', title:'Airport Systems Quiz', desc:'Online quiz covering airport terminal design, runway configuration, and airspace management.', icon:'fas fa-question-circle', iconBg:'rgba(21,101,192,0.15)', iconColor:'#42a5f5', status:'done', score:'88/100', dueDate:'March 15, 2026' },
  { id:4, type:'discussion', course:'AVM 204.A', title:'Discussion: Future of Sustainable Airports', desc:'Participate in the forum discussion about sustainable airport development and green energy initiatives.', icon:'fas fa-comments', iconBg:'rgba(200,16,46,0.15)', iconColor:'var(--color-primary)', status:'pending', dueDate:'June 20, 2026', count:'5 replies needed' },
  { id:5, type:'quiz', course:'AVM 306.A', title:'Operations Management Midterm Practice', desc:'Practice quiz with 30 questions covering process management, lean operations, and KPIs.', icon:'fas fa-clipboard-check', iconBg:'rgba(46,125,50,0.15)', iconColor:'#66bb6a', status:'done', score:'92/100', dueDate:'April 5, 2026' },
  { id:6, type:'task', course:'MGMT 311.A', title:'Project Milestone Review', desc:'Submit mid-project milestone documentation for review by your project advisor.', icon:'fas fa-flag', iconBg:'rgba(245,124,0,0.15)', iconColor:'#ffa726', status:'done', count:'Submitted May 10' },
  { id:7, type:'task', course:'AVM 402.A', title:'Simulation Round 3 Decision', desc:'Submit your business decisions for Round 3 of the Aviation Business Simulation.', icon:'fas fa-gamepad', iconBg:'rgba(233,30,140,0.15)', iconColor:'var(--color-pink)', status:'pending', dueDate:'June 12, 2026' },
  { id:8, type:'discussion', course:'MGMT 311.A', title:'Discussion: Agile vs Waterfall', desc:'Share your perspective on Agile vs Waterfall project management methodologies with real-world examples.', icon:'fas fa-comments', iconBg:'rgba(21,101,192,0.15)', iconColor:'#42a5f5', status:'pending', dueDate:'June 15, 2026', count:'3 replies needed' },
];

const ctItems = [
  { label: 'AVM 306.A Attendance', done: true },
  { label: 'AVM 306.A Resources', done: true },
  { label: 'AVM 204.A Airport Systems Quiz', done: true },
  { label: 'AVM 306.A Practice Midterm', done: true },
  { label: 'MGMT 311.A Milestone Review', done: true },
  { label: 'AVM 306.A FMEA Classwork I', done: true },
  { label: 'SCM 205 Case Study', done: true },
  { label: 'AVM 204.A Guest Speaker Reflection', done: true },
  { label: 'AVM 204.A Discussion Forum', done: false },
  { label: 'AVM 402.A Simulation Round 3', done: false },
  { label: 'MGMT 311.A Agile Discussion', done: false },
  { label: 'AVM 204.A Final Exam Prep Quiz', done: false },
];

document.getElementById('ct-list').innerHTML = ctItems.map(i => `
  <div class="ct-item">
    <div class="ct-check ${i.done ? 'done' : 'pending'}">${i.done ? '<i class="fas fa-check"></i>' : ''}</div>
    <div style="font-size:12px;color:${i.done ? 'var(--color-text-muted)' : 'var(--color-text)'};${i.done?'text-decoration:line-through;':''}">${i.label}</div>
  </div>
`).join('');

const typeLabels = { attendance:'Attendance', resource:'Resources', quiz:'Quiz', discussion:'Discussion', task:'Task' };
const typeOrder = ['attendance', 'quiz', 'discussion', 'task', 'resource'];

function renderActivities(list) {
  const grouped = {};
  typeOrder.forEach(t => { grouped[t] = list.filter(a => a.type === t); });
  let html = '';
  typeOrder.forEach(type => {
    if (!grouped[type].length) return;
    html += `<div class="activity-section">
      <div class="activity-section-title">${typeLabels[type]}</div>
      ${grouped[type].map(a => `
        <div class="act-item">
          <div class="act-icon" style="background:${a.iconBg};color:${a.iconColor};"><i class="${a.icon}"></i></div>
          <div class="act-body">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;">
              <div class="act-title">${a.title}</div>
              <span class="chip ${a.status==='done'?'chip-green':'chip-orange'}">${a.status==='done'?'Completed':'Pending'}</span>
            </div>
            <div class="act-meta">${a.course}${a.dueDate?' &bull; Due: '+a.dueDate:''}${a.count?' &bull; '+a.count:''}</div>
            <div style="font-size:12px;color:var(--color-text-muted);">${a.desc}</div>
            <div class="act-footer">
              ${a.score ? `<span style="font-size:12px;font-weight:600;color:#66bb6a;"><i class="fas fa-star"></i> Score: ${a.score}</span>` : ''}
              ${a.status==='pending' ? `<button class="btn btn-primary btn-sm" onclick="showToast('Opening activity...','info')"><i class="fas fa-arrow-right"></i> Start</button>` : `<button class="btn btn-ghost btn-sm"><i class="fas fa-eye"></i> Review</button>`}
            </div>
          </div>
        </div>
      `).join('')}
    </div>`;
  });
  document.getElementById('activities-main').innerHTML = html || '<div class="empty-state"><i class="fas fa-bolt"></i><p>No activities found.</p></div>';
}

renderActivities(ACTIVITIES);

function filterActivities() {
  const course = document.getElementById('act-course-filter').value;
  renderActivities(course ? ACTIVITIES.filter(a => a.course === course) : ACTIVITIES);
}
</script>
</body>
</html>
